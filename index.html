<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infosoft XXV — Logo Turntable</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600&display=swap');

  :root{
    --chrome-1:#f4f5f7;
    --chrome-2:#c9cbd1;
    --chrome-3:#8a8d95;
    --chrome-4:#4a4c52;
    --red-1:#e8202f;
    --red-2:#a3121c;
    --ink:#141414;
    --bg-edge:#5b5e66;
    --bg-mid:#a9abb3;
    --bg-glow:#eef0f4;
    --card-line:rgba(255,255,255,0.55);
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    width:100%;
    overflow:hidden;
  }

  body{
    font-family:'Barlow Condensed', sans-serif;
    background:
      radial-gradient(ellipse 900px 620px at 68% 22%, var(--bg-glow) 0%, rgba(238,240,244,0) 62%),
      radial-gradient(ellipse 1100px 800px at 50% 50%, var(--bg-mid) 0%, var(--bg-edge) 78%);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }

  body::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.14) 100%);
    pointer-events:none;
  }

  .stage{
    position:relative;
    width:min(92vw, 1180px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(14px, 2.4vh, 26px);
    padding:clamp(18px, 3vh, 34px) clamp(18px, 3vw, 40px);
  }

  .brandrow{
    display:flex;
    align-items:baseline;
    gap:14px;
    letter-spacing:0.04em;
  }

  .brand-xxv{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-style:italic;
    font-size:clamp(28px, 4.2vw, 46px);
    line-height:1;
    background:linear-gradient(180deg, var(--chrome-1) 0%, var(--chrome-2) 38%, var(--chrome-4) 62%, var(--chrome-2) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 1px 0 rgba(255,255,255,0.4);
    filter:drop-shadow(0 2px 6px rgba(0,0,0,0.18));
  }

  .brand-name{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:clamp(16px, 2.1vw, 22px);
    letter-spacing:0.28em;
    color:var(--ink);
    text-transform:uppercase;
  }

  .brand-name .slash{
    color:var(--red-1);
    font-weight:700;
  }

  .subtitle{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:500;
    font-size:clamp(12px, 1.5vw, 15px);
    letter-spacing:0.34em;
    text-transform:uppercase;
    color:var(--chrome-4);
    text-align:center;
  }

  .subtitle .yr{
    color:var(--red-2);
    font-weight:600;
  }

  .frame{
    position:relative;
    width:100%;
    border-radius:20px;
    padding:3px;
    background:linear-gradient(135deg, var(--chrome-1), var(--chrome-3) 30%, var(--red-1) 50%, var(--chrome-3) 70%, var(--chrome-1));
    box-shadow:
      0 30px 60px -20px rgba(20,20,20,0.45),
      0 8px 24px -8px rgba(20,20,20,0.30);
  }

  .frame-inner{
    position:relative;
    border-radius:17px;
    overflow:hidden;
    background:#0c0c0d;
    line-height:0;
  }

  video{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:16/9;
    background:#0c0c0d;
  }

  .controls{
    position:absolute;
    right:16px;
    bottom:16px;
    display:flex;
    gap:10px;
    z-index:5;
  }

  .ctrl-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,0.35);
    background:rgba(20,20,20,0.55);
    backdrop-filter:blur(6px);
    cursor:pointer;
    transition:background 0.2s ease, transform 0.15s ease;
  }

  .ctrl-btn:hover{
    background:rgba(232,32,47,0.85);
    transform:translateY(-1px);
  }

  .ctrl-btn svg{ width:18px; height:18px; fill:#f4f5f7; }

  .footer-line{
    display:flex;
    align-items:center;
    gap:10px;
    opacity:0.85;
  }

  .footer-line .dash{
    width:34px;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--red-1));
  }
  .footer-line .dash.right{
    background:linear-gradient(90deg, var(--red-1), transparent);
  }

  .footer-text{
    font-family:'Oswald', sans-serif;
    font-size:clamp(10px, 1.2vw, 12px);
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--chrome-4);
  }

  @media (max-width:560px){
    .controls{ right:10px; bottom:10px; }
    .ctrl-btn{ width:34px; height:34px; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="brandrow">
      <span class="brand-xxv">XXV</span>
      <span class="brand-name">INFO<span class="slash">//</span>SOFT</span>
    </div>
    <div class="subtitle"><span class="yr">2001&ndash;2026</span></div>

    <div class="frame">
      <div class="frame-inner">
        <video id="brandVideo" autoplay muted loop playsinline preload="auto">
          <source src="logo-turntable.webm" type="video/webm">
          <source src="logo-turntable.mp4" type="video/mp4">
          Your browser does not support embedded video.
        </video>

        <div class="controls">
          <div class="ctrl-btn" id="playBtn" title="Play / Pause">
            <svg id="playIcon" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="footer-line">
      <span class="dash"></span>
      <span class="footer-text">Infosoft Consulting Corporation &nbsp;|&nbsp; Celebrating 25 Years of Service</span>
      <span class="dash right"></span>
    </div>
  </div>

<script>
  const video = document.getElementById('brandVideo');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

  playBtn.addEventListener('click', () => {
    if (video.paused) { video.play(); } else { video.pause(); }
  });

  video.addEventListener('play', () => { playIcon.innerHTML = ICON_PAUSE; });
  video.addEventListener('pause', () => { playIcon.innerHTML = ICON_PLAY; });
</script>
</body>
</html>
